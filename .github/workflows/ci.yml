name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      # Unit tests plus integration tests against PostgreSQL (Testcontainers uses the runner's Docker)
      - name: Run tests
        run: ./mvnw -B verify

      - name: Build Docker image
        run: docker build -t psytrance-tracker-backend .
