# Provide via environment variables (or a local .env / IDE run config) - never commit real values here.
# Required: DB_URL, DB_USERNAME, DB_PASSWORD, JWT_SECRET
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
jwt.secret=${JWT_SECRET}
# Goabase event source: the full list is fetched at most once per cache-ttl
goabase.base-url=https://www.goabase.net
goabase.cache-ttl=10m

# Password reset: links point to the frontend and expire after token-ttl
app.frontend-url=${FRONTEND_URL:http://localhost:5173}
app.password-reset.token-ttl=30m

# Email (optional). Set SPRING_MAIL_HOST, SPRING_MAIL_PORT, SPRING_MAIL_USERNAME and SPRING_MAIL_PASSWORD
# to send real emails; without SPRING_MAIL_HOST, reset links are written to the log instead.
app.mail.from=${MAIL_FROM:no-reply@psytrance-tracker.local}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
